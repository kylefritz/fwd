name: Feature request
description: An idea for fwd.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like fwd to do?
      description: The problem you're running into is as useful as the solution you have in mind.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: fwd version
      placeholder: "0.1.0"
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      render: text
