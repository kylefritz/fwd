name: Beta

# Every commit on main that passes CI becomes a prerelease, named after the
# next patch version: v0.1.1-beta.<run>. Installs with `update_channel: beta`
# in ~/.config/fwd/config.yaml pick these up; everyone else only sees tagged
# releases, because GitHub's "latest release" skips prereleases.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: beta
  cancel-in-progress: false

jobs:
  beta:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: macos-26
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Version
        run: |
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v -e '-' | head -1)
          IFS=. read -r major minor patch <<< "${last:-v0.0.0}"
          major=${major#v}
          echo "VERSION=$major.$minor.$((patch + 1))-beta.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Get ready to sign
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/ci-signing.sh
      - name: Build the app
        run: make app VERSION="$VERSION"
      - name: Check the bundle
        run: |
          test "$(build/fwd.app/Contents/Resources/bin/fwd --version)" = "$VERSION"
          codesign --verify --deep --strict build/fwd.app
          # A notarized build has to pass Gatekeeper as a download would.
          if [ -n "${NOTARY_KEY:-}" ]; then
            spctl --assess --type execute -vv build/fwd.app
            echo "NOTES=.github/release-notes-notarized.md" >> "$GITHUB_ENV"
          else
            echo "NOTES=.github/release-notes.md" >> "$GITHUB_ENV"
          fi
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run gets the same run number, so the same version.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already published"
            exit 0
          fi
          gh release create "v$VERSION" build/fwd.zip --prerelease --target "$SHA" \
            --title "fwd $VERSION" \
            --notes "$(printf 'Beta built from %s. Set `update_channel: beta` in ~/.config/fwd/config.yaml to follow these.\n\n' "${SHA:0:7}"; cat "$NOTES")"
      - name: Keep only the newest ten betas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName | select(test("-beta\\."))' \
            | tail -n +11 \
            | xargs -r -n1 gh release delete --yes --cleanup-tag
