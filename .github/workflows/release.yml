name: Release

on:
  push:
    # Betas (v0.1.1-beta.7) are published by beta.yml, not here.
    tags: ["v*", "!v*-*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Test
        run: make test
      - name: Build the app
        run: make app VERSION="$VERSION"
      - name: Check the bundle
        run: |
          test "$(build/fwd.app/Contents/Resources/bin/fwd --version)" = "$VERSION"
          codesign --verify --deep --strict build/fwd.app
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/fwd.zip --title "fwd $VERSION" --generate-notes
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        if: ${{ env.TAP_TOKEN != '' }}
        run: scripts/update-formula.sh "$VERSION"
