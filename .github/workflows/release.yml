name: Release

on:
  push:
    # Betas (v0.1.1-beta.7) are published by beta.yml, not here.
    tags: ["v*", "!v*-*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      # Job level, so the tap step's `if` can see it; a step's own env
      # isn't available to its `if`. A deploy key that can only write to
      # the tap repository.
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Test
        run: make test
      - name: Get ready to sign
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/ci-signing.sh
      - name: Build the app
        run: make app VERSION="$VERSION"
      - name: Check the bundle
        run: |
          test "$(build/fwd.app/Contents/Resources/bin/fwd --version)" = "$VERSION"
          codesign --verify --deep --strict build/fwd.app
          # A notarized build has to pass Gatekeeper as a download would.
          if [ -n "${NOTARY_KEY:-}" ]; then
            spctl --assess --type execute -vv build/fwd.app
            echo "NOTES=.github/release-notes-notarized.md" >> "$GITHUB_ENV"
          else
            echo "NOTES=.github/release-notes.md" >> "$GITHUB_ENV"
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run after a later step failed: the release is already
          # there, so only replace its asset and carry on to the tap.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME is already published; replacing fwd.zip"
            gh release upload "$GITHUB_REF_NAME" build/fwd.zip --clobber
            exit 0
          fi
          # The install notes come first, then GitHub's list of changes.
          gh release create "$GITHUB_REF_NAME" build/fwd.zip --title "fwd $VERSION" --notes-file "$NOTES" --generate-notes
      - name: Update the Homebrew tap
        if: ${{ env.TAP_DEPLOY_KEY != '' }}
        run: scripts/update-formula.sh "$VERSION"
      - name: Say the Homebrew tap was not updated
        if: ${{ env.TAP_DEPLOY_KEY == '' }}
        # A block, since ": " in a plain YAML value starts a mapping.
        run: |
          echo "::warning::The Homebrew tap was not updated: the TAP_DEPLOY_KEY secret is empty, so brew still serves the previous version."
